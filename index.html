<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重説補助ツール — 物件情報自動取得</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-sub: #f7f6f3;
    --bg-ter: #f0ede8;
    --text: #1a1a18;
    --text-sub: #6b6b65;
    --text-ter: #a0a09a;
    --border: rgba(0,0,0,0.12);
    --border-em: rgba(0,0,0,0.22);
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 12px;
    --teal: #0F6E56;
    --teal-light: #E1F5EE;
    --amber: #854F0B;
    --amber-light: #FAEEDA;
    --red: #A32D2D;
    --red-light: #FCEBEB;
    --coral: #D85A30;
  }

  body {
    font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--bg-ter);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  header {
    background: var(--bg);
    border-bottom: 0.5px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  header .logo {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  header .logo span { color: var(--teal); }
  header .badge {
    font-size: 11px;
    background: var(--teal-light);
    color: var(--teal);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .container {
    max-width: 820px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  .card {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-sub);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .card-title svg { flex-shrink: 0; }

  /* ── 入力行 ── */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }
  .input-row input[type="text"] {
    flex: 1;
    height: 40px;
    padding: 0 14px;
    border: 0.5px solid var(--border-em);
    border-radius: var(--radius-md);
    font-size: 14px;
    font-family: inherit;
    color: var(--text);
    background: var(--bg);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .input-row input[type="text"]:focus {
    border-color: var(--teal);
    box-shadow: 0 0 0 3px rgba(15,110,86,0.1);
  }
  .input-row input::placeholder { color: var(--text-ter); }

  .btn {
    height: 40px;
    padding: 0 18px;
    border: 0.5px solid var(--border-em);
    border-radius: var(--radius-md);
    font-size: 13px;
    font-family: inherit;
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: background 0.12s;
  }
  .btn:hover { background: var(--bg-sub); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
  .btn.primary {
    background: var(--teal);
    color: #fff;
    border-color: var(--teal);
    font-weight: 500;
  }
  .btn.primary:hover { background: #0d5f4a; }
  .btn.icon-only { width: 40px; padding: 0; justify-content: center; }

  .hint {
    font-size: 12px;
    color: var(--text-ter);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  /* ── 地図 ── */
  .map-outer {
    position: relative;
    width: 100%;
    height: 500px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-lg);
    overflow: hidden;
    background: #e8e4db;
    margin-bottom: 10px;
  }
  @media (max-width: 560px) {
    .map-outer { height: 280px; }
  }
  #map { width: 100%; height: 100%; }

  .crosshair {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 500;
    width: 30px; height: 30px;
  }
  .crosshair::before, .crosshair::after {
    content: '';
    position: absolute;
    background: var(--coral);
  }
  .crosshair::before { width: 1.5px; height: 30px; top: 0; left: 14.25px; }
  .crosshair::after  { width: 30px; height: 1.5px; top: 14.25px; left: 0; }
  .crosshair-dot {
    position: absolute;
    width: 7px; height: 7px;
    background: var(--coral);
    border-radius: 50%;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .map-label {
    position: absolute;
    bottom: 10px; left: 10px;
    background: rgba(255,255,255,0.92);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 6px 10px;
    font-size: 12px;
    color: var(--text-sub);
    z-index: 500;
    max-width: 300px;
    backdrop-filter: blur(4px);
  }
  .map-label b { color: var(--text); }

  .map-tip {
    position: absolute;
    top: 10px; right: 10px;
    background: rgba(255,255,255,0.88);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 5px 10px;
    font-size: 11px;
    color: var(--text-sub);
    z-index: 500;
    backdrop-filter: blur(4px);
  }

  /* ── 座標確認行 ── */
  .coord-row {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 0;
  }
  .coord-pill {
    flex: 1;
    background: var(--bg-sub);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 8px 12px;
    font-size: 12px;
    color: var(--text-sub);
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Courier New', monospace;
  }
  .coord-pill .cl { font-family: inherit; color: var(--text-ter); font-size: 11px; }

  /* ── 結果エリア ── */
  .result-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  @media (max-width: 560px) { .result-grid { grid-template-columns: 1fr; } }

  .result-item {
    background: var(--bg-sub);
    border-radius: var(--radius-md);
    padding: 10px 13px;
  }
  .result-item.full { grid-column: span 2; }
  @media (max-width: 560px) { .result-item.full { grid-column: span 1; } }

  .r-label {
    font-size: 11px;
    color: var(--text-ter);
    margin-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .r-value {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }
  .r-value.safe  { color: var(--teal); }
  .r-value.warn  { color: var(--amber); }
  .r-value.danger { color: var(--red); }

  .section-sep {
    grid-column: span 2;
    font-size: 11px;
    color: var(--text-ter);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding-top: 12px;
    border-top: 0.5px solid var(--border);
    margin-top: 4px;
  }
  @media (max-width: 560px) { .section-sep { grid-column: span 1; } }

  .generated-text-box {
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 14px;
    font-size: 13px;
    line-height: 1.9;
    color: var(--text);
    margin-bottom: 10px;
    white-space: pre-wrap;
  }

  .spinner {
    width: 15px; height: 15px;
    border: 1.5px solid var(--border);
    border-top-color: var(--teal);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-msg {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 20px 0;
    font-size: 13px;
    color: var(--text-sub);
  }

  .err-msg {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--red);
    padding: 10px 0;
  }

  .api-note {
    background: var(--amber-light);
    border: 0.5px solid #FAC775;
    border-radius: var(--radius-md);
    padding: 10px 14px;
    font-size: 12px;
    color: var(--amber);
    margin-bottom: 14px;
    line-height: 1.7;
  }
  .api-note a { color: var(--amber); }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--text-ter);
    padding: 24px 0 12px;
  }

  /* Leaflet上書き */
  .leaflet-control-attribution { font-size: 10px !important; }
</style>
</head>
<body>

<header>
  <div class="logo">重説<span>補助</span>ツール</div>
  <div class="badge">無料 / β版</div>
</header>

<div class="container">

  <!-- データ取得中はここに結果が表示されます -->

  <!-- STEP 1: 物件位置の特定 -->
  <div class="card">
    <div class="card-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      Step 1 — 物件の所在地を特定
    </div>

    <div class="input-row">
      <input type="text" id="addr-input" placeholder="住所を入力（例：広島市中区紙屋町1丁目1番）" />
      <button class="btn primary" id="geocode-btn" onclick="geocode()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        検索
      </button>
      <button class="btn icon-only" id="gps-btn" onclick="getGPS()" title="現在地を取得">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/></svg>
      </button>
    </div>

    <p class="hint">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      住所で大まかに移動し、地図をドラッグして物件敷地に照準を合わせてください
    </p>

    <div class="map-outer">
      <div id="map"></div>
      <div class="crosshair"><div class="crosshair-dot"></div></div>
      <div class="map-label" id="map-label">地図をドラッグして物件位置に合わせてください</div>
      <div class="map-tip">ドラッグで微調整</div>
    </div>

    <div class="coord-row">
      <div class="coord-pill">
        <span class="cl">緯度</span>
        <span id="lat-out">—</span>
      </div>
      <div class="coord-pill">
        <span class="cl">経度</span>
        <span id="lng-out">—</span>
      </div>
      <button class="btn primary" id="fetch-btn" onclick="fetchInfo()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
        公的情報を取得
      </button>
    </div>
  </div>

  <!-- STEP 2: 取得結果 -->
  <div id="result-area"></div>

</div>

<footer>
  データソース：不動産情報ライブラリ（国土交通省）／国土地理院 ／ OpenStreetMap contributors<br>
  本ツールは重要事項説明書作成の補助を目的とするものです。宅建士による最終確認が必要です。
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>

/* ===== 設定 ===== */
const PROXY_URL = 'https://reinfolib-proxy.junjiro1129.workers.dev';

/* ===== 地図初期化 ===== */
let map;
let currentLat = null, currentLng = null;
const DEFAULT_LAT = 34.3954, DEFAULT_LNG = 132.4596; // 広島市中区

function initMap(lat, lng) {
  if (map) {
    map.setView([lat, lng], 17);
    return;
  }
  map = L.map('map', { zoomControl: true }).setView([lat, lng], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);
  map.on('move', onMapMove);
  map.on('moveend', onMapMoveEnd);
}

function onMapMove() {
  const c = map.getCenter();
  document.getElementById('lat-out').textContent = c.lat.toFixed(6);
  document.getElementById('lng-out').textContent = c.lng.toFixed(6);
}

function onMapMoveEnd() {
  const c = map.getCenter();
  currentLat = parseFloat(c.lat.toFixed(6));
  currentLng = parseFloat(c.lng.toFixed(6));
  document.getElementById('fetch-btn').disabled = false;
  document.getElementById('map-label').innerHTML =
    `座標確定：<b>${currentLat}, ${currentLng}</b>　「公的情報を取得」を押してください`;
  document.getElementById('result-area').innerHTML = '';
}

/* ===== 住所検索 ===== */
async function geocode() {
  const q = document.getElementById('addr-input').value.trim();
  if (!q) return;
  const btn = document.getElementById('geocode-btn');
  setLoading(btn, '検索中…');
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' 日本')}&format=json&limit=1&accept-language=ja`,
      { headers: { 'Accept-Language': 'ja' } }
    );
    const data = await res.json();
    if (!data || data.length === 0) { showErrInline('住所が見つかりませんでした。別の表記でお試しください。'); return; }
    const lat = parseFloat(data[0].lat), lng = parseFloat(data[0].lon);
    initMap(lat, lng);
    map.setView([lat, lng], 17);
  } catch(e) {
    showErrInline('通信エラーが発生しました。ネットワーク接続をご確認ください。');
  } finally {
    resetBtn(btn,
      `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>検索`
    );
  }
}

/* ===== GPS取得 ===== */
function getGPS() {
  if (!navigator.geolocation) { alert('このブラウザでは位置情報を利用できません。'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { initMap(pos.coords.latitude, pos.coords.longitude); map.setView([pos.coords.latitude, pos.coords.longitude], 17); },
    () => alert('位置情報の取得が許可されていません。')
  );
}

/* ===== Enterキーで検索 ===== */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('addr-input').addEventListener('keydown', e => { if (e.key === 'Enter') geocode(); });
  initMap(DEFAULT_LAT, DEFAULT_LNG);
});

/* ===== タイル座標変換 ===== */
function lng2tile(lng, z) { return Math.floor((lng + 180) / 360 * Math.pow(2, z)); }
function lat2tile(lat, z) { return Math.floor((1 - Math.log(Math.tan(lat * Math.PI / 180) + 1 / Math.cos(lat * Math.PI / 180)) / Math.PI) / 2 * Math.pow(2, z)); }

/* ===== APIから安全にfeatures[0].propertiesを取得 ===== */
async function safeApiCall(apiId, z, x, y) {
  try {
    const res = await fetch(`${PROXY_URL}?api=${apiId}&z=${z}&x=${x}&y=${y}`);
    const json = await res.json();
    if (json && Array.isArray(json.features) && json.features.length > 0) {
      return json.features[0].properties || {};
    }
  } catch(e) {}
  return null; // null = 区域外 or 取得失敗
}

function hazardResult(props, valueFn, level) {
  if (!props) return { value: '区域外', level: 'safe' };
  try {
    const v = valueFn(props);
    return { value: v || '区域内', level };
  } catch(e) {
    return { value: '区域内', level };
  }
}

/* ===== 公的情報取得 ===== */
async function fetchInfo() {
  if (!currentLat || !currentLng) return;
  const btn = document.getElementById('fetch-btn');
  setLoading(btn, '取得中…');
  const area = document.getElementById('result-area');
  area.innerHTML = `<div class="card"><div class="loading-msg"><div class="spinner"></div>不動産情報ライブラリAPIに接続中…</div></div>`;

  const z = 15;
  const x = lng2tile(currentLng, z);
  const y = lat2tile(currentLat, z);

  try {
    // 7本のAPIを並列取得（各自エラー時はnullを返す）
    const [zoning, fire, flood, highTide, tsunami, sediment, liquid] = await Promise.all([
      safeApiCall('XKT002', z, x, y), // 用途地域
      safeApiCall('XKT014', z, x, y), // 防火地域
      safeApiCall('XKT026', z, x, y), // 洪水
      safeApiCall('XKT027', z, x, y), // 高潮
      safeApiCall('XKT028', z, x, y), // 津波
      safeApiCall('XKT029', z, x, y), // 土砂災害
      safeApiCall('XKT025', z, x, y), // 液状化
    ]);

    const parsedZoning = {
      用途地域: zoning?.use_area_ja                    || '都市計画区域外',
      建蔽率:   zoning?.u_building_coverage_ratio_ja   || '—',
      容積率:   zoning?.u_floor_area_ratio_ja          || '—',
      防火指定: fire?.fire_prevention_on_ja            || '指定なし',
      高度地区: zoning?.koudo_chiku_ja                 || '—',
    };

    const parsedHazard = {
      洪水浸水想定:     hazardResult(flood,    p => p.A31a_201 ? `${p.A31a_201}〜${p.A31a_202}` : p.maximum_scale_chogoku, 'warn'),
      高潮浸水想定:     hazardResult(highTide, p => p.scale || p.A31a_201, 'warn'),
      津波浸水想定:     hazardResult(tsunami,  p => p.A40_003 ? `〜${p.A40_003}m` : '区域内', 'warn'),
      土砂災害警戒区域: hazardResult(sediment, p => p.A33_007 ? `${p.A33_005}（${p.A33_007}）` : '区域内', 'danger'),
      液状化リスク:     hazardResult(liquid,   p => p.topographic_classification_name_ja || p.note, 'warn'),
    };

    renderResults({ zoning: parsedZoning, hazard: parsedHazard }, currentLat, currentLng, false);

  } catch(e) {
    area.innerHTML = `<div class="card"><div class="err-msg">⚠️ 予期しないエラーが発生しました。<br><small>${e}</small></div></div>`;
  }

  resetBtn(btn,
    `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>公的情報を取得`
  );
}

/* ===== モックデータ ===== */
function getMockData() {
  return {
    zoning: {
      用途地域: '第一種住居地域',
      建蔽率: '60%',
      容積率: '200%',
      防火指定: '準防火地域',
      高度地区: '第三種高度地区',
      地区計画: 'なし'
    },
    hazard: {
      洪水浸水想定: { value: '0.5m〜3m未満', level: 'warn' },
      内水氾濫: { value: '0.5m未満', level: 'warn' },
      土砂災害警戒区域: { value: '区域外', level: 'safe' },
      土砂災害特別警戒区域: { value: '区域外', level: 'safe' },
      津波浸水想定: { value: '区域外', level: 'safe' },
      高潮浸水想定: { value: '区域外', level: 'safe' },
      液状化リスク: { value: '発生しやすい', level: 'warn' }
    }
  };
}

/* ===== 結果レンダリング ===== */
function renderResults(data, lat, lng, isMock) {
  const z = data.zoning;
  const h = data.hazard;

  /* 重説記載文の自動生成 */
  const zoningText = `本物件は都市計画法に基づき${z['用途地域']}に指定されており、建蔽率${z['建蔽率']}・容積率${z['容積率']}の制限を受ける。防火上の指定は${z['防火指定']}である。`;

  const hazardLines = [];
  if (h['洪水浸水想定']?.level !== 'safe')
    hazardLines.push(`洪水浸水想定区域（想定最大規模）において浸水深${h['洪水浸水想定']?.value}の区域に含まれる`);
  if (h['高潮浸水想定']?.level !== 'safe')
    hazardLines.push(`高潮浸水想定区域において${h['高潮浸水想定']?.value}の区域に含まれる`);
  if (h['津波浸水想定']?.level !== 'safe')
    hazardLines.push(`津波浸水想定区域において${h['津波浸水想定']?.value}の区域に含まれる`);
  if (h['土砂災害警戒区域']?.level !== 'safe')
    hazardLines.push(`土砂災害警戒区域（${h['土砂災害警戒区域']?.value}）に該当する`);
  if (h['液状化リスク']?.level !== 'safe')
    hazardLines.push(`液状化リスクは「${h['液状化リスク']?.value}」地形区分に該当する`);

  const safeItems = [];
  if (h['洪水浸水想定']?.level === 'safe') safeItems.push('洪水浸水想定区域');
  if (h['土砂災害警戒区域']?.level === 'safe') safeItems.push('土砂災害警戒区域');
  if (h['津波浸水想定']?.level === 'safe') safeItems.push('津波浸水想定区域');
  if (h['高潮浸水想定']?.level === 'safe') safeItems.push('高潮浸水想定区域');

  const hazardText = (hazardLines.length > 0 ? hazardLines.join('。') + '。' : '') +
    (safeItems.length > 0 ? `${safeItems.join('・')}には含まれない。` : '');

  const generatedText = zoningText + '\n' + hazardText;

  document.getElementById('result-area').innerHTML = `
  <div class="card">
    <div class="card-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      Step 2 — 取得結果
      ${isMock ? '<span style="font-size:10px;font-weight:400;color:var(--text-ter);margin-left:6px">（デモデータ）</span>' : ''}
      <span style="margin-left:auto;font-size:11px;font-weight:400;color:var(--text-ter)">${lat.toFixed(5)}, ${lng.toFixed(5)}</span>
    </div>

    <div class="result-grid">
      <div class="section-sep">法令上の制限（不動産情報ライブラリ API）</div>

      <div class="result-item">
        <div class="r-label">用途地域</div>
        <div class="r-value">${z['用途地域']}</div>
      </div>
      <div class="result-item">
        <div class="r-label">建蔽率 / 容積率</div>
        <div class="r-value">${z['建蔽率']} / ${z['容積率']}</div>
      </div>
      <div class="result-item">
        <div class="r-label">防火指定</div>
        <div class="r-value">${z['防火指定']}</div>
      </div>
      <div class="result-item">
        <div class="r-label">高度地区</div>
        <div class="r-value">${z['高度地区']}</div>
      </div>

      <div class="section-sep">ハザード情報（不動産情報ライブラリ API）</div>

      ${Object.entries(h).map(([label, v]) => `
      <div class="result-item">
        <div class="r-label">${label}</div>
        <div class="r-value ${v.level}">${v.value}</div>
      </div>`).join('')}

      <div class="section-sep">重説記載文（自動生成）</div>

      <div class="result-item full" style="background:var(--bg)">
        <div class="r-label" style="margin-bottom:8px">以下のテキストをコピーして重説に貼り付けてください</div>
        <div class="generated-text-box" id="gen-text">${generatedText}</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn" onclick="copyText()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            テキストをコピー
          </button>
          <button class="btn" onclick="exportExcel()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            Excelに出力（準備中）
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card" style="background:var(--bg-sub);border-style:dashed">
    <div class="card-title">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      登記情報の取得（要外部サービス）
    </div>
    <p style="font-size:13px;color:var(--text-sub);line-height:1.8;margin-bottom:12px">
      所有者・権利関係（甲区・乙区）の情報は公開APIでは取得できません。<br>
      以下のサービスで取得後、手動で記入してください。
    </p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <a href="https://www1.touki-kyoutaku-online.moj.go.jp/" target="_blank" class="btn">登記情報提供サービス（法務省）</a>
      <a href="https://www.homes-sys.co.jp/" target="_blank" class="btn">ホームズ（API連携・有償）</a>
      <a href="https://www.torus.co.jp/" target="_blank" class="btn">トーラス不動産レーダー（有償）</a>
    </div>
  </div>
  `;
}

/* ===== コピー ===== */
function copyText() {
  const t = document.getElementById('gen-text');
  if (!t) return;
  navigator.clipboard.writeText(t.innerText).then(() => {
    const btn = event.target.closest('button');
    const orig = btn.innerHTML;
    btn.innerHTML = '✓ コピーしました';
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  });
}

/* ===== Excel出力（準備中） ===== */
function exportExcel() { alert('Excel出力機能は次のバージョンで実装予定です。'); }

/* ===== ユーティリティ ===== */
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }
function setLoading(btn, msg) { btn.disabled = true; btn.innerHTML = `<div class="spinner"></div>${msg}`; }
function resetBtn(btn, html) { btn.disabled = false; btn.innerHTML = html; }
function showErrInline(msg) { document.getElementById('result-area').innerHTML = `<div class="card"><div class="err-msg">⚠️ ${msg}</div></div>`; }

</script>
</body>
</html>
